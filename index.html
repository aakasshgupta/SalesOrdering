    const rate=Number(S.app.rate)||0;
    const rows=[['Date','Member','Purpose','Start time','End time','Start location','End location','Start odometer','End odometer','Miles','Duration (min)','Status','Reimbursement','Orders','Order value','Notes']];
    jFiltered().forEach(j=>{ const od=jOrders(j); rows.push([new Date(j.startAt).toISOString().slice(0,10),nameOf(j.memberId),j.purpose,fmtTime(j.startAt),fmtTime(j.endAt),j.startPlace,j.endPlace||'',j.startOdo,j.endOdo==null?'':j.endOdo,j.distance||'',j.durationMin||'',JSTATUS[j.status],rate&&j.distance?(j.distance*rate).toFixed(2):'',od.length,od.reduce((a,o)=>a+(o.total||0),0).toFixed(2),j.notes||'']); });
    try{ await S.downloads.save({filename:`seaways-journeys-${new Date().toISOString().slice(0,10)}.csv`,data:toCSV(rows)}); }catch(e){ if(e&&e.code!=='declined') toast('Download failed'); }
  },

  /* team */
  addAccount:()=>{ modal(`<div class="sh"><h2>Add login</h2><button class="x" data-a="close">×</button></div>${accountForm()}<div class="actions"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="saveAccount">Create login</button></div>`); },
  editAccount:(el)=>{ const a=S.accounts[el.dataset.id]; modal(`<div class="sh"><h2>Edit login</h2><button class="x" data-a="close">×</button></div>${accountForm(a)}<div class="actions">${a.id!==S.me.id?`<button class="btn danger" data-a="deleteAccount" data-id="${esc(a.id)}">Delete</button>`:''}<button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="saveAccount" data-id="${esc(a.id)}">Save</button></div>`); },
  saveAccount: async (el)=>{
    const f=readForm('accForm'); const err=$('#accerr'); const id=el.dataset.id; const ex=id&&S.accounts[id];
    const active=ex? !!document.querySelector('#accForm [name=active]').checked : true;
    if(ex && ex.id===S.me.id && (f.role!=='admin'||!active)){ err.textContent="You can't remove your own admin access."; return; }
    el.disabled=true;
    try{ await API.call('account',{id:id||null,name:f.name,username:f.username,role:f.role,active,password:f.pw||''}); closeModal(); toast(ex?'Login updated':'Login created'); syncSoon(0); }
    catch(e){ el.disabled=false; err.textContent=e.message||'Could not save.'; }
  },
  deleteAccount: async (el)=>{ if(!confirm('Delete this login? They can no longer sign in. Their past orders and trips stay.')) return;
    try{ await API.call('account-delete',{id:el.dataset.id}); closeModal(); toast('Login deleted'); syncSoon(0); }catch(e){ toast(e.message||'Could not delete.'); } },
  changePw:()=>{ closeModal(); modal(`<div class="sh"><h2>Change password</h2><button class="x" data-a="close">×</button></div><form id="pwForm" class="stack" onsubmit="return false"><label class="f">Current password<input class="input" type="password" name="cur" autocomplete="current-password"></label><label class="f">New password<span class="hint">At least 6 characters</span><input class="input" type="password" name="pw" autocomplete="new-password"></label><label class="f">Repeat new password<input class="input" type="password" name="pw2" autocomplete="new-password"></label><div class="err" id="pwerr"></div></form><div class="actions"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="savePw">Change password</button></div>`); },
  savePw: async (el)=>{ const f=readForm('pwForm'); const err=$('#pwerr');
    if(f.pw.length<6){ err.textContent='New password must be at least 6 characters.'; return; } if(f.pw!==f.pw2){ err.textContent='New passwords don\'t match.'; return; }
    el.disabled=true;
    try{ await API.call('password',{current:f.cur,next:f.pw}); closeModal(); toast('Password changed'); }
    catch(e){ el.disabled=false; err.textContent=e.message||'Could not change the password.'; } },
  saveCompany: async ()=>{ const f=readForm('coForm'); const co={name:up(f.name),tagline:up(f.tagline),address:up(f.address),phone:f.phone,email:f.email.toLowerCase()}; try{ await S.db.doc('settings/app').set({...S.app,company:co}); toast('Company details saved'); }catch(e){ toast(writeErr(e,'admin')); } },
  saveRate: async ()=>{ const v=$('#rateIn').value.trim(); try{ await S.db.doc('settings/app').set({...S.app,rate:v===''?null:num(v)}); toast('Rate saved'); }catch(e){ toast(writeErr(e,'admin')); } },
  capsAll: async (el)=>{
    if(!confirm('Convert all product, customer and order text to capitals?')) return; el.disabled=true; el.textContent='Converting…'; let n=0, fail=0;
    const P=['name','category','pack','sku'], C=['name','contact','address','city','taxId','notes'];
    const jobs=[];
    S.products.forEach(p=>{ const patch={}; P.forEach(k=>{ if(p[k] && p[k]!==up(p[k])) patch[k]=up(p[k]); }); if(Object.keys(patch).length) jobs.push(['catalog',p.id,patch]); });
    S.customers.forEach(c=>{ const patch={}; C.forEach(k=>{ if(c[k] && c[k]!==up(c[k])) patch[k]=up(c[k]); }); if(Object.keys(patch).length) jobs.push(['customers',c.id,patch]); });
    S.orders.forEach(o=>{ const cu={...(o.customer||{})}; let ch=false; ['name','contact','address','city'].forEach(k=>{ if(cu[k]&&cu[k]!==up(cu[k])){cu[k]=up(cu[k]);ch=true;} });
      const lines=(o.lines||[]).map(l=>{ const nl={...l}; ['name','pack','sku'].forEach(k=>{ if(nl[k]&&nl[k]!==up(nl[k])){nl[k]=up(nl[k]);ch=true;} }); return nl; });
      if(o.notes&&o.notes!==up(o.notes)) ch=true; if(ch) jobs.push(['orders',o.id,{customer:cu,lines,notes:up(o.notes)}]); });
    try{ await S.db.bulk(jobs.map(([c,id,patch])=>({op:'update',col:c,id,data:patch}))); n=jobs.length; }catch(e){ fail=jobs.length; }
    el.disabled=false; el.textContent='Convert now'; toast(jobs.length?`Converted ${n} records${fail?`, ${fail} failed`:''}`:'Everything is already in capitals');
  },
  close:()=>closeModal(),
  scrim:(el,e)=>{ if(e.target===el) closeModal(); }
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-a]'); if(!el) return; const f=A[el.dataset.a]; if(!f) return; if(el.dataset.a!=='scrim') e.preventDefault(); f(el,e); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#modal').innerHTML) closeModal(); if(e.key==='Enter' && e.target.closest && e.target.closest('#loginForm,#setupForm') && e.target.tagName==='INPUT'){ e.preventDefault(); const b=document.querySelector('#authroot .btn'); b&&b.click(); } });

const IN = {
  q:(t)=>{ S.q[t.dataset.k]=t.value; render(); },
  custAll:(t)=>{ S.custAll=t.checked; render(); },
  qty:(t)=>{ if(t.value==='') return; setQty(t.dataset.id, Number(t.value)); clearTimeout(IN._t); IN._t=setTimeout(render, Number(t.value)<=0?0:600); },
  lprice:(t)=>{ if(!S.draft.prices) S.draft.prices={}; const v=t.value.trim(); if(v==='') delete S.draft.prices[t.dataset.id]; else S.draft.prices[t.dataset.id]=Math.max(0,num(v)); saveDraft(); clearTimeout(IN._p); IN._p=setTimeout(render,700); },
  draftField:(t)=>{ S.draft[t.dataset.k]=t.value; saveDraft(); },
  csvpaste:(t)=>previewImport(t.value),
  csvfile:(t)=>{ const f=t.files[0]; if(!f) return; f.text().then(txt=>{ const p=$('#csvpaste'); if(p) p.value=txt; previewImport(txt); }); },
  pfile:(t)=>{ const f=t.files[0]; if(!f) return; S._pfile=f; S._removePhoto=false; const th=$('#pthumb'); if(th){ th.innerHTML=''; const im=document.createElement('img'); im.src=URL.createObjectURL(f); th.appendChild(im); } const n=$('#pfilename'); if(n) n.textContent=f.name; },
  bulkphotos:(t)=>{ if(t.files.length) runBulkPhotos(t.files); },
  bulk:(t)=>{ const p=S.products.find(x=>x.id===t.dataset.id); if(!p) return; let f=t.dataset.f; let v;
    if(f==='name'){ v=up(t.value); if(!v) return; }
    else if(f==='category'){ v=up(t.value); }
    else if(f==='cprice'){ const cps={...(bval(p,'customerPrices')||{})}; cps[S.bulk.cust]=t.value.trim()===''?null:num(t.value); f='customerPrices'; v=cps; }
    else v=t.value.trim()===''?null:num(t.value);
    bset(p,f,v); t.classList.toggle('chg',!eqv(f,v,baseVal(p,f))); t.closest('tr').classList.toggle('chg',bchanged(p));
    if(SF.includes(f)){ const w=caseWt({unitQty:bval(p,'unitQty'),unit:bval(p,'unit'),pcs:bval(p,'pcs')}); const c=document.getElementById('cw_'+p.id); if(c) c.textContent=w?w.text:'—'; }
    clearTimeout(IN._b); IN._b=setTimeout(()=>{ const n=bulkChangedCount(); const sb=document.querySelector('[data-a=bulkSave]'); if(sb){ sb.disabled=!n; sb.textContent=`Save changes${n?' ('+n+')':''}`; } const db=document.querySelector('[data-a=bulkDiscard]'); if(db) db.disabled=!n; },150); },
  bulkUnit:(t)=>{ const p=S.products.find(x=>x.id===t.dataset.id); bset(p,'unit',t.value); render(); },
  bulkCust:(t)=>{ S.bulk.cust=t.value; if(!t.value && S.bulk.apField==='cprice') S.bulk.apField='price'; render(); },
  pcalc:()=>{ const f=readForm('prodForm'); const st={unitQty:num(f.unitQty),unit:f.unit,pcs:num(f.pcs)}; const w=caseWt(st); const o=$('#pcalcOut'); if(o) o.textContent=w?`Case: ${packText(st)} = ${w.text}`:'Case weight is calculated from unit size × pcs per case.'; },
  bulkActive:(t)=>{ const p=S.products.find(x=>x.id===t.dataset.id); bset(p,'active',t.checked); render(); },
  bulkSel:(t)=>{ S.bulk.sel[t.dataset.id]=t.checked; render(); },
  bulkSelAll:(t)=>{ bulkList().forEach(p=>S.bulk.sel[p.id]=t.checked); render(); },
  bulkCat:(t)=>{ S.bulk.cat=t.value; render(); },
  bulkOnly:(t)=>{ S.bulk.only=t.checked; render(); },
  apField:(t)=>{ S.bulk.apField=t.value; render(); },
  jf:(t)=>{ S.jform[t.dataset.k]=t.value; },
  jphoto: async (t)=>{ const f=t.files[0]; if(!f) return; try{ S.jform[t.dataset.k]=await compressToDataURL(f); render(); }catch(e){ toast('Could not read that photo. Try again.'); } },
  jfMember:(t)=>{ S.jf.member=t.value; render(); },
  jfStatus:(t)=>{ S.jf.status=t.value; render(); }
};
const ON_CHANGE=['bulkUnit','bulkCust','csvfile','pfile','bulkphotos','custAll','bulkActive','bulkSel','bulkSelAll','bulkCat','bulkOnly','apField','jphoto','jfMember','jfStatus'];
document.addEventListener('input',e=>{ const t=e.target; const k=t.dataset&&t.dataset.in; if(k && IN[k] && !ON_CHANGE.includes(k)) IN[k](t,e); });
document.addEventListener('change',e=>{ const t=e.target; const k=t.dataset&&t.dataset.in; if(k && IN[k] && (ON_CHANGE.includes(k) || t.tagName==='SELECT')) IN[k](t,e); });

/* ---------- data layer: Netlify function + Blobs ---------- */
const IMGKIND={productImages:'product',journeyPhotos:'journey'};
const API={
  token:null,
  setToken(t){ API.token=t; try{ t?localStorage.setItem('sw_tok',t):localStorage.removeItem('sw_tok'); }catch(e){} },
  async call(path,body){
    let r; try{ r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'content-type':'application/json',...(API.token?{authorization:'Bearer '+API.token}:{})},body:body?JSON.stringify(body):undefined}); }
    catch(e){ throw {code:'network',message:'No internet connection.'}; }
    const j=await r.json().catch(()=>({}));
    if(r.status===401 && path!=='login'){ S.authMsg='Please sign in again.'; stopData(); renderAuth(); throw {code:'unauthenticated',message:j.error}; }
    if(!r.ok) throw {code:j.code||(r.status===403?'permission-denied':'error'),message:j.error||'Something went wrong.'};
    return j;
  }
};
S.cols={}; S.revs={}; S.queue=[];
const qKey=()=> 'sw_q_'+(S.me?S.me.id:'x');
function derive(){
  const c=S.cols, vals=k=>Object.entries(c[k]||{}).map(([id,d])=>({id,...d}));
  S.products=vals('catalog'); S.customers=vals('customers'); S.customers.forEach(x=>delete S.pendingCustomers[x.id]);
  S.orders=vals('orders').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); S.journeys=vals('journeys').sort((a,b)=>(b.startAt||0)-(a.startAt||0));
  const acc={}; vals('accounts').forEach(a=>acc[a.id]=a); S.accounts=acc; S.app=(c.settings&&c.settings.app)||{};
}
function applyLocal(op){ const col=S.cols[op.col]||(S.cols[op.col]={});
  if(op.op==='delete') delete col[op.id]; else if(op.op==='set') col[op.id]=JSON.parse(JSON.stringify(op.data)); else if(col[op.id]) col[op.id]={...col[op.id],...JSON.parse(JSON.stringify(op.data))}; }
let flushing=null;
async function flush(){
  if(flushing) return flushing;
  flushing=(async()=>{ let result='ok';
    while(S.queue.length){ const batch=S.queue.slice(0,400);
      try{ await API.call('write',{ops:batch.map(x=>x.op)}); S.queue.splice(0,batch.length); lsSet(qKey(),S.queue.map(x=>x.op)); batch.forEach(x=>x.res&&x.res('ok')); }
      catch(e){ if(e.code==='network'||e.code==='error'&&/Busy/.test(e.message||'')){ result='queued'; batch.forEach(x=>{ x.res&&x.res('queued'); x.res=null; x.rej=null; }); break; }
        S.queue.splice(0,batch.length); lsSet(qKey(),S.queue.map(x=>x.op)); batch.forEach(x=>x.rej&&x.rej(e)); if(!batch.some(x=>x.rej)) toast(e.message||'A change could not be saved.'); syncSoon(0); break; } }
    flushing=null; if(result==='ok') syncSoon(700); return result; })();
  return flushing;
}
function write(ops){ return new Promise((res,rej)=>{ ops.forEach((op,i)=>{ applyLocal(op); S.queue.push({op,res:i===ops.length-1?res:null,rej:i===ops.length-1?rej:null}); }); lsSet(qKey(),S.queue.map(x=>x.op)); derive(); render(); flush(); }); }
function docRef(col,id){ const kind=IMGKIND[col]; return { id,
  get: async()=>{ if(kind){ const d=await API.call(`img?kind=${kind}&id=${encodeURIComponent(id)}`).catch(()=>({})); return {exists:!!d.data,data:()=>d}; } const d=(S.cols[col]||{})[id]; return {exists:!!d,data:()=>d}; },
  set: d=> kind ? API.call('img',{kind,id,...d}) : write([{op:'set',col,id,data:d}]),
  update: d=> write([{op:'update',col,id,data:d}]),
  delete: ()=> kind ? Promise.resolve() : write([{op:'delete',col,id}]) }; }
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
S.db={ collection:col=>({ doc:id=>docRef(col,id||genId()) }), doc:p=>{ const [c,id]=p.split('/'); return docRef(c,id); }, bulk:ops=>write(ops) };
S.downloads={ save: async ({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/.test(filename)?'text/csv':/\.html$/.test(filename)?'text/html':'application/octet-stream'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); return {status:'saved'}; } };
S.assets={};

let syncT=null, syncing=false;
function syncSoon(ms){ clearTimeout(syncT); syncT=setTimeout(sync, ms==null?45000:ms); }
async function sync(){
  if(!API.token||syncing) return; syncing=true;
  try{ const r=await API.call('sync?revs='+encodeURIComponent(JSON.stringify(S.revs)));
    const prevRole=S.me&&S.me.role; S.me={...r.me};
    for(const [k,v] of Object.entries(r.cols)){ S.cols[k]=v.docs; S.revs[k]=v.rev; }
    saveCache(); S.queue.forEach(x=>applyLocal(x.op)); derive(); S.accounts[S.me.id]={...S.me,...(S.accounts[S.me.id]||{})};
    if(prevRole && prevRole!==S.me.role){ S.revs={}; S.view=role()==='admin'?'dashboard':'order'; }
    if(!S.ready2){ S.ready2=true; S.draft=lsGet(draftKey())||newDraft(); S.view=role()==='admin'?'dashboard':'order'; S.step='channel'; showApp(); }
    render();
  }catch(e){}
  syncing=false; syncSoon(document.hidden?180000:45000);
}
function saveCache(){ try{ localStorage.setItem('sw_cache',JSON.stringify({me:S.me,cols:S.cols,revs:S.revs})); }catch(e){ try{ localStorage.removeItem('sw_cache'); }catch(x){} } }
function loadCache(){ const c=lsGet('sw_cache'); if(!c||!c.me) return false; S.me=c.me; S.cols=c.cols||{}; S.revs=c.revs||{}; derive(); S.accounts[S.me.id]={...S.me,...(S.accounts[S.me.id]||{})};
  S.ready2=true; S.draft=lsGet(draftKey())||newDraft(); S.view=role()==='admin'?'dashboard':'order'; S.step='channel'; showApp(); render(); return true; }
async function startSession(fromBoot){ S.revs={}; S.cols={}; S.ready2=false;
  if(!(fromBoot && loadCache())) authScreen('<p class="muted">Loading…</p>');
  if(S.me){ S.queue=(lsGet(qKey())||[]).map(op=>({op})); }
  await sync(); if(!S.me){ renderAuth(); return; }
  if(!S.queue.length) S.queue=(lsGet(qKey())||[]).map(op=>({op})); if(S.queue.length) flush(); }
function stopData(){ clearTimeout(syncT); API.setToken(null); try{ localStorage.removeItem('sw_cache'); }catch(e){} S.me=null; S.ready2=false; S.cols={}; S.revs={}; S.queue=[]; derive(); }
function refreshSession(){ if(!S.me){ renderAuth(); return; } showApp(); render(); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && API.token) syncSoon(0); });
window.addEventListener('online',()=>{ if(API.token){ flush(); syncSoon(0); } });

function boot(){
  S.ready=true; S.bootstrapped=null;
  API.token=(()=>{ try{ return localStorage.getItem('sw_tok'); }catch(e){ return null; } })();
  if(API.token){ startSession(true); }
  else authScreen('<p class="muted">Loading…</p>');
  API.call('status').then(r=>{ S.bootstrapped=r.setup; if(!S.me && !API.token) renderAuth(); }).catch(()=>{ S.bootstrapped=true; if(!S.me && !API.token){ S.authMsg='Can\'t reach the server. Check your connection.'; renderAuth(); } });
}
boot();
})();
</script>
