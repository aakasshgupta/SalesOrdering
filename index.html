<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14284A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seaways">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2314284A%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2254%22 text-anchor=%22middle%22 fill=%22%23D4B065%22 font-family=%22Arial%22 font-weight=%22700%22%3ES%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seaways Exim Order Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--surface-2:#F8F9FB;--ink:#0F1D33;--muted:#5D6B80;--line:#DCE2EB;
  --navy:#14284A;--navy-ink:#FFFFFF;--gold:#A9843A;--gold-soft:#F4EEDF;
  --btn:#14284A;--btn-ink:#FFFFFF;--ok:#1F7A4D;--ok-soft:#E3F2EA;--warn:#9A5F0E;--warn-soft:#FBF0DC;
  --bad:#B3362E;--bad-soft:#F9E4E2;--info:#1E4E8C;--info-soft:#E3ECF8;
  --navh:64px;--side:232px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220;--surface:#111C2E;--surface-2:#16233A;--ink:#E6EBF2;--muted:#93A0B4;--line:#24344F;
  --navy:#0D192D;--navy-ink:#E6EBF2;--gold:#D4B065;--gold-soft:#2A2517;
  --btn:#D4B065;--btn-ink:#0D192D;--ok:#5BC08C;--ok-soft:#14301F;--warn:#E3A94B;--warn-soft:#33260F;
  --bad:#EE8078;--bad-soft:#3A1917;--info:#8DB4EA;--info-soft:#15263F;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1220;--surface:#111C2E;--surface-2:#16233A;--ink:#E6EBF2;--muted:#93A0B4;--line:#24344F;
  --navy:#0D192D;--navy-ink:#E6EBF2;--gold:#D4B065;--gold-soft:#2A2517;
  --btn:#D4B065;--btn-ink:#0D192D;--ok:#5BC08C;--ok-soft:#14301F;--warn:#E3A94B;--warn-soft:#33260F;
  --bad:#EE8078;--bad-soft:#3A1917;--info:#8DB4EA;--info-soft:#15263F;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}h2{font-size:18px;font-weight:600}h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* shell */
.app{display:flex;min-height:100vh}
[hidden]{display:none!important}
.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:3px solid var(--gold)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:16px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:12px;opacity:.75}
.topbar .grow{flex:1}
.rolepill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:inherit;background:transparent;cursor:pointer}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{width:100%;max-width:1180px;margin:0 auto;padding:20px 16px calc(var(--navh) + 32px)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomnav button{flex:1;border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer}
.bottomnav button svg{width:22px;height:22px}
.bottomnav button.on{color:var(--ink);font-weight:600}
.bottomnav button.on svg{color:var(--gold)}
@media (min-width:900px){
  :root{--navh:0px}
  .bottomnav{display:none}
  .topbar .brand{display:none}
  .side{display:flex;flex-direction:column;width:var(--side);flex:0 0 var(--side);background:var(--navy);color:var(--navy-ink);position:sticky;top:0;height:100vh;padding:22px 14px}
  .side .brand{padding:0 10px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
  .side .brand b{font-size:18px}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;opacity:.78;padding:10px 12px;border-radius:8px;text-align:left;cursor:pointer;font-size:14.5px}
  .side nav button svg{width:19px;height:19px}
  .side nav button:hover{opacity:1;background:rgba(255,255,255,.06)}
  .side nav button.on{opacity:1;background:rgba(255,255,255,.09);box-shadow:inset 3px 0 0 var(--gold)}
  .side .foot{margin-top:auto;font-size:12.5px;opacity:.8;padding:0 10px;display:flex;flex-direction:column;gap:8px}
  .topbar{border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink)}
  .rolepill{border-color:var(--line)}
  .content{padding:28px 32px 40px}
}

/* building blocks */
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead p{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;min-height:42px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--gold);color:#fff}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.linkbtn{border:0;background:none;color:var(--info);cursor:pointer;padding:0;font-weight:600}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea.input{min-height:80px;resize:vertical}
.input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500}
label.f .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:38px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .chip.on{background:var(--gold);color:#0D192D;border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:var(--gold);color:#0D192D;border-color:var(--gold)}}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-new{background:var(--info-soft);color:var(--info)}
.s-confirmed{background:var(--gold-soft);color:var(--gold)}
.s-delivered{background:var(--ok-soft);color:var(--ok)}
.s-cancelled{background:var(--bad-soft);color:var(--bad)}
.st-low{background:var(--warn-soft);color:var(--warn)}
.st-out{background:var(--bad-soft);color:var(--bad)}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.notice{border-radius:10px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* channel tiles: the two doors */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.door{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:14px;min-height:170px;overflow:hidden}
.door::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold)}
.door .ic{width:44px;height:44px;border-radius:10px;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.door .ic svg{width:24px;height:24px}
.door h2{font-size:20px}
.door .meta{margin-top:auto;font-size:13px;color:var(--muted)}
.door:hover{border-color:var(--gold)}
@media (min-width:700px){.door{min-height:200px;padding:24px}.door h2{font-size:24px}}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .amt{font-weight:600;text-align:right}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 38px}

/* stepper header for order flow */
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--gold)}
.custbar{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px}
.custbar .grow{flex:1;min-width:0}

/* product grid */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media (min-width:1100px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pcard.in{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pimg{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;overflow:hidden;padding:10px;border-bottom:1px solid var(--line)}
.pimg img{width:100%;height:100%;object-fit:contain;object-position:center;background:#fff;display:block}
.pimg:has(.ph){background:var(--surface-2)}
.pimg .ph{font-weight:700;font-size:22px;color:var(--muted);letter-spacing:.02em}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pname{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pmeta{font-size:12.5px;color:var(--muted)}
.pbody .pill{align-self:flex-start}
.brand b,.brand span{white-space:nowrap}
.pprice{font-weight:700;font-size:15px;margin-top:auto;padding-top:6px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px;height:40px}
.stepper button{width:40px;height:100%;border:0;background:var(--surface-2);cursor:pointer;font-size:20px;line-height:1;flex:0 0 40px}
.stepper input{flex:1;min-width:0;border:0;text-align:center;background:var(--surface);height:100%;font-weight:600;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.addbtn{margin-top:8px;height:40px;border:1px solid var(--navy);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer}
.cartbar{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 10px);margin-top:18px;z-index:15;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 12px 12px 16px;box-shadow:0 8px 24px rgba(10,20,40,.25)}
.cartbar .grow{flex:1}
.cartbar b{font-size:17px}
.cartbar .btn{background:var(--gold);color:#fff}

/* review table */
.lines .ln{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 16px;border-top:1px solid var(--line)}
.lines .ln:first-child{border-top:0}
.lines .ln .stepper{margin-top:0;width:140px}
.totals{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-top:2px solid var(--ink)}
.totals b{font-size:22px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
@media (min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 16px}
.stat .v{font-size:22px;font-weight:700;margin-top:4px}
.stat .l{font-size:13px;color:var(--muted)}

/* admin catalog board */
.segtoggle{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;margin-bottom:12px}
.segtoggle button{flex:1;border:0;background:none;padding:9px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.segtoggle button.on{background:var(--navy);color:#fff}
.board{display:grid;grid-template-columns:1fr;gap:16px}
.board .col[data-hide="1"]{display:none}
@media (min-width:1100px){.segtoggle{display:none}.board{grid-template-columns:1fr 1fr}.board .col[data-hide="1"]{display:block}}
.colhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.colhead h2{display:flex;align-items:center;gap:10px}
.colhead h2 .ic{width:30px;height:30px;border-radius:8px;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.colhead h2 .ic svg{width:17px;height:17px}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--surface-2);flex:0 0 44px;overflow:hidden;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff;padding:2px}
.li.off{opacity:.5}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,15,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px;padding:24px}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:20px;line-height:1}
.sheet .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.seg2{display:flex;gap:8px}
.seg2 label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.seg2 input{accent-color:var(--gold);width:18px;height:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;font-weight:500;max-width:90vw}
.done{text-align:center;padding:36px 20px}
.done .check{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 16px}
.done .check svg{width:32px;height:32px}
.tablewrap{overflow-x:auto}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
/* v2 additions */
input.input:not([type=email]):not([type=password]):not([type=date]):not([type=datetime-local]):not(.nocaps),textarea.input{text-transform:uppercase}
.input::placeholder{text-transform:none}
.t,.pname,.li .s,.custbar,.kv dd,.door h2{text-transform:uppercase}
.topbar .who{font-size:13px;opacity:.85}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--navy)}
.authcard{width:100%;max-width:400px;background:var(--surface);border-radius:14px;padding:28px 24px;border-top:4px solid var(--gold)}
.authcard .brand{margin-bottom:22px}.authcard .brand b{font-size:20px}.authcard .brand span{color:var(--muted)}
.err{color:var(--bad);font-size:13.5px;min-height:18px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.tbl .name{font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.tbl .route{max-width:240px;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.cell{width:92px;min-height:36px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:right}
.cell.w{width:108px}
input.cell{text-transform:uppercase}
.cell.chg{border-color:var(--gold);background:var(--gold-soft)}
tr.chg td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.tog.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tog.chg{outline:2px solid var(--gold);outline-offset:1px}
.applybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.applybar select,.applybar input{width:auto;min-width:130px}
.cb{width:18px;height:18px;accent-color:var(--gold)}
.jlive{background:var(--navy);color:#fff;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.jlive .big{font-size:30px;font-weight:700}
.jlive .muted{color:rgba(255,255,255,.7)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3FCB7E;margin-right:6px;box-shadow:0 0 0 4px rgba(63,203,126,.2)}
.s-active{background:var(--ok-soft);color:var(--ok)}.s-pending{background:var(--warn-soft);color:var(--warn)}.s-verified{background:var(--info-soft);color:var(--info)}
.photobtn{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
.photoprev{width:100%;max-height:220px;object-fit:contain;border-radius:8px;background:#000;margin-top:6px}
.more-list button{width:100%;justify-content:flex-start}
</style>
</head>
<body>
<div id="authroot"></div>
<div class="app" id="approot" hidden>
  <aside class="side">
    <div class="brand"><b>Seaways Exim</b><span>Order desk</span></div>
    <nav id="sidenav"></nav>
    <div class="foot" id="sidefoot"></div>
  </aside>
  <div class="main">
    <header class="topbar">

(function(){

const CH = {restaurant:{label:'Restaurant',short:'Rest.',icon:I.resto},grocery:{label:'Grocery store',short:'Store',icon:I.store}};
const STATUS = [['new','New'],['confirmed','Confirmed'],['delivered','Delivered'],['cancelled','Cancelled']];

/* ---------- state ---------- */
const S = {
  ready:false, db:null, user:null, assets:null, downloads:null,
  readOnly:false, unsubs:[],
  accounts:{}, accountsLoaded:false, app:{}, me:null,
  products:[], customers:[], orders:[], journeys:[],
  pendingCustomers:{}, view:'home', step:'channel', draft:null, lastOrder:null,
  q:{cust:'',prod:'',orders:'',customers:'',cat:'',bulk:''}, cat:'', custAll:false,
  orderFilter:'all', custFilter:'all', catSeg:'restaurant', placing:false,

const role = () => S.me ? S.me.role : null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const up = v => String(v==null?'':v).trim().toUpperCase();
const money = n => (Number(n)||0).toLocaleString('en-US',{style:'currency',currency:'USD'});
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; };
const mi = n => (Math.round((Number(n)||0)*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const initials = s => String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const fmtDate = t => t ? new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
const fmtDT = t => t ? new Date(t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
const fmtTime = t => t ? new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '';
const dur = m => { m=Math.max(0,Math.round(m||0)); const h=Math.floor(m/60); return h?`${h}h ${m%60}m`:`${m}m`; };
const startOfDay = (d=new Date()) => new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
const startOfMonth = () => { const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),1).getTime(); };
const toLocalInput = t => { if(!t) return ''; const d=new Date(t); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const skuId = sku => 'p-' + String(sku).trim().toLowerCase().replace(/[^a-z0-9_\-.~:@+]/g,'-').slice(0,150);
const pidFor = (sku,name) => sku ? skuId(sku) : 'n-' + String(name).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,150);
const CAT_NONE='UNCATEGORIZED';
const catOf = p => p.category || CAT_NONE;
function catChips(list, cur, action){ const counts={}; list.forEach(p=>{ const c=catOf(p); counts[c]=(counts[c]||0)+1; }); const cats=Object.keys(counts).sort((a,b)=>a===CAT_NONE?1:b===CAT_NONE?-1:a.localeCompare(b)); if(cats.length<2 && !cur) return '';
  return `<div class="chips" style="margin-bottom:12px"><button class="chip ${!cur?'on':''}" data-a="${action}" data-c="">ALL <span style="opacity:.6">${list.length}</span></button>${cats.map(c=>`<button class="chip ${cur===c?'on':''}" data-a="${action}" data-c="${esc(c)}">${esc(c)} <span style="opacity:.6">${counts[c]}</span></button>`).join('')}</div>`; }
const IMGC={}, IMGP={};
const imgTag = p => p && p.imageId ? `<img alt="" data-img="${esc(p.imageId)}"${IMGC[p.imageId]?` src="${IMGC[p.imageId]}"`:''}>` : '';
function hydrateImages(root){ (root||document).querySelectorAll('img[data-img]:not([src])').forEach(img=>{ const id=img.dataset.img;
  if(IMGC[id]){ img.src=IMGC[id]; return; }
  if(!IMGP[id]) IMGP[id]=S.db.collection('productImages').doc(id).get().then(d=>{ const v=d.exists&&d.data().data; if(v&&/^data:image\//.test(v)) IMGC[id]=v; return IMGC[id]; }).catch(()=>null);
  IMGP[id].then(v=>{ if(v) img.src=v; else img.remove(); }); }); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2800); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function nameOf(id){ const a=S.accounts[id]; return a ? a.name : (id?'SALESPERSON':'—'); }
function getCustomer(id){ return S.customers.find(c=>c.id===id) || S.pendingCustomers[id] || null; }
function productsFor(ch){ return S.products.filter(p=>p.active!==false && (p.channels||[]).includes(ch)); }
const hasStock = p => !(p.stock===null || p.stock===undefined || p.stock==='');
function stockPill(p){
  if(!hasStock(p)) return '';
  const s=Number(p.stock);
  if(s<=0) return '<span class="pill st-out">Out of stock</span>';
  if(s<=(Number(p.lowAt)||10)) return `<span class="pill st-low">Low: ${s}</span>`;
  return `<span class="pill st-ok">${s} in stock</span>`;
}
async function withRetry(fn){ try{ return await fn(); }catch(e){ if(e&&e.code==='unavailable'){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); return fn(); } throw e; } }
function writeErr(e, what){
  const c=e&&e.code;
  if(c==='permission-denied'||c==='invalid_argument') return what==='admin'?'Only an admin can change this.':'You are not allowed to change this. Ask the admin.';
  if(c==='resource-exhausted'||c==='quota_exceeded') return 'The free database limit for today is reached. Try again tomorrow or upgrade the Firebase plan.';
  if(c==='unauthenticated') return 'You were signed out. Sign in again.';
  return 'Could not save. Check your connection and try again.';
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function commit(p){ return Promise.race([p.then(v=>v==='queued'?'queued':'ok'),sleep(6000).then(()=>'queued')]); }
async function pool(items, n, fn){ const q=[...items]; await Promise.all(Array.from({length:n},async()=>{ while(q.length){ await fn(q.shift()); } })); }

/* ---------- units, pack, pricing ---------- */
const UNITS=['LB','KG','G','OZ','L','ML','PC'];
const UNIT_RX='(LBS?|KGS?|GRAMS?|GMS?|G|OZ|LTRS?|L|ML|PCS?)';
function normU(u){ u=String(u||'').toUpperCase(); if(/^LB/.test(u)) return 'LB'; if(/^KG/.test(u)) return 'KG'; if(/^(G|GM|GRAM)/.test(u)) return 'G'; if(u==='OZ') return 'OZ'; if(/^(L|LTR)S?$/.test(u)) return 'L'; if(u==='ML') return 'ML'; if(/^PC/.test(u)) return 'PC'; return 'LB'; }
function parsePack(t){ t=up(t); if(!t) return null; let m;
  if((m=t.match(new RegExp('^(\\d+(?:\\.\\d+)?)\\s*[X×*]\\s*(\\d+(?:\\.\\d+)?)\\s*'+UNIT_RX+'\\b')))) return {pcs:+m[1],unitQty:+m[2],unit:normU(m[3])};
  if((m=t.match(new RegExp('^(\\d+(?:\\.\\d+)?)\\s*'+UNIT_RX+'\\s*[X×*]\\s*(\\d+(?:\\.\\d+)?)')))) return {pcs:+m[3],unitQty:+m[1],unit:normU(m[2])};
  if((m=t.match(new RegExp('^(\\d+(?:\\.\\d+)?)\\s*'+UNIT_RX+'\\b')))) return {pcs:1,unitQty:+m[1],unit:normU(m[2])};
  return null; }
function struct(p){ if(p.unitQty!=null||p.pcs!=null) return {unitQty:p.unitQty==null?null:Number(p.unitQty),unit:p.unit||'LB',pcs:p.pcs==null?null:Number(p.pcs)}; return parsePack(p.pack)||{unitQty:null,unit:'LB',pcs:null}; }
const trimN = n => String(Math.round(n*100)/100);
function packText(st,fallback){ return st && st.unitQty && st.pcs ? `${trimN(st.pcs)} X ${trimN(st.unitQty)} ${st.unit}` : (fallback||''); }
function caseWt(st){ if(!st||!st.unitQty||!st.pcs||st.unit==='PC') return null; let t=st.unitQty*st.pcs, u=st.unit;
  if(u==='G'&&t>=1000){t/=1000;u='KG';} else if(u==='OZ'&&t>=16){t/=16;u='LB';} else if(u==='ML'&&t>=1000){t/=1000;u='L';} return {qty:Math.round(t*100)/100,unit:u,text:trimN(t)+' '+u}; }
function toLb(w){ if(!w) return 0; return {LB:1,KG:2.20462,G:0.00220462,OZ:1/16}[w.unit]*w.qty||0; }
const packOf = p => packText(struct(p), p.pack);
const cwOf = p => { const w=caseWt(struct(p)); return w?w.text:''; };
function priceFor(p,cid){ const cp=cid&&p.customerPrices?p.customerPrices[cid]:null; return cp!=null&&cp!==''?Number(cp):(Number(p.price)||0); }
const hasSpecial = (p,cid) => !!(cid&&p.customerPrices&&p.customerPrices[cid]!=null&&p.customerPrices[cid]!=='');
const COMPANY_DEFAULT={name:'SEAWAYS EXIM LLC',tagline:'GLOBAL TRADE',address:'15633 JULIES WAY, ORLAND PARK, ILLINOIS 60462, UNITED STATES',phone:'+1 (708) 240-3612',email:'info@seawaysexim.com'};
const company = () => ({...COMPANY_DEFAULT,...(S.app.company||{})});
function visibleCustomers(){ if(role()==='admin') return S.customers; const me=S.me.id; return S.customers.filter(c=>c.createdBy===me||(c.assignedTo||[]).includes(me)).concat(Object.values(S.pendingCustomers).filter(c=>c.createdBy===me && !S.customers.some(x=>x.id===c.id))); }

/* ---------- passwords (PBKDF2) ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw, salt){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},key,256);
  return b64(bits);
}
async function makeCred(pw){ const salt=b64(crypto.getRandomValues(new Uint8Array(16))); return {salt, hash:await hashPw(pw,salt)}; }
const activeAccounts = () => Object.values(S.accounts).filter(a=>a.active!==false);

/* ---------- draft ---------- */
const draftKey = () => 'sw_draft_' + (S.me?S.me.id:'anon');
function newDraft(ch){ return {channel:ch||null, customerId:null, customer:null, lines:{}, prices:{}, notes:'', deliveryDate:''}; }
function saveDraft(){ lsSet(draftKey(), S.draft); }
function draftCount(){ return Object.values(S.draft&&S.draft.lines||{}).reduce((a,b)=>a+b,0); }
function draftLines(){ const out=[]; for(const [pid,qty] of Object.entries(S.draft.lines||{})){ if(qty>0){ const p=S.products.find(x=>x.id===pid); if(p) out.push({p,qty}); } } return out; }
function linePrice(p){ const o=S.draft.prices&&S.draft.prices[p.id]; return o!=null&&o!==''?Number(o):priceFor(p,S.draft.customerId); }
function isAdjusted(p){ const o=S.draft.prices&&S.draft.prices[p.id]; return o!=null&&o!==''&&Math.abs(Number(o)-priceFor(p,S.draft.customerId))>0.004; }
const minOf = p => p.minPrice!=null&&p.minPrice!==''?Number(p.minPrice):null;
function belowMin(p){ const m=minOf(p); return m!=null && linePrice(p)<m-0.004; }
function draftTotal(){ return draftLines().reduce((a,{p,qty})=>a+qty*linePrice(p),0); }
function setQty(pid,q){ q=Math.max(0,Math.min(99999,Math.round(q)||0)); if(q) S.draft.lines[pid]=q; else delete S.draft.lines[pid]; saveDraft(); }
function stepQty(pid,d){ const p=S.products.find(x=>x.id===pid); const moq=Math.max(1,Number(p&&p.moq)||1); const cur=S.draft.lines[pid]||0;
  let n = d>0 ? (cur? cur+1 : moq) : (cur-1<moq ? 0 : cur-1); setQty(pid,n); }

/* ---------- journeys helpers ---------- */
const myActiveJourney = () => S.me && S.journeys.find(j=>j.memberId===S.me.id && j.status==='active');
function jOrders(j){ const end=j.endAt||Date.now(); return S.orders.filter(o=>o.createdBy===j.memberId && o.createdAt>=j.startAt && o.createdAt<=end && o.status!=='cancelled'); }
function jStats(list){ const done=list.filter(j=>j.status!=='active'); const miles=done.reduce((a,j)=>a+(Number(j.distance)||0),0); const mins=done.reduce((a,j)=>a+(Number(j.durationMin)||0),0);
  return {miles, trips:list.length, hours:mins/60, avg: done.length?miles/done.length:0, pending:list.filter(j=>j.status==='pending').length}; }
async function compressToDataURL(file){
  const bmp=await createImageBitmap(file);
  for(const [m,q] of [[1100,.62],[850,.55],[650,.5],[480,.45]]){
    const s=Math.min(1,m/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); const d=c.toDataURL('image/jpeg',q); if(d.length<230000) return d; }
  throw new Error('too big');
}
function getGeo(){ return new Promise((res,rej)=>{ if(!navigator.geolocation) return rej(new Error('no')); navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy)}),rej,{enableHighAccuracy:true,timeout:12000,maximumAge:60000}); }); }
const mapLink = g => g ? `<a href="https://www.google.com/maps?q=${g.lat},${g.lng}" target="_blank" rel="noopener" class="linkbtn small">Map</a>` : '';

/* ---------- navigation ---------- */
function navItems(){
  return role()==='admin'
    ? [['dashboard','Dashboard',I.dash],['orders','Orders',I.orders],['order','New order',I.plus],['catalog','Catalog',I.box],['bulk','Bulk edit',I.sliders],['customers','Customers',I.users],['journeys','Journeys',I.route],['team','Team',I.team]]
    : [['order','New order',I.plus],['orders','My orders',I.orders],['catalog','Catalog',I.box],['journey','Journeys',I.route],['customers','Customers',I.users]];
}
function go(view){
  S.view=view;
  if(view==='order'){
    if(!S.draft) S.draft=newDraft();
    if(S.step==='done'){ S.draft=newDraft(); saveDraft(); }

  }

}
function renderNav(){
  const items=navItems();

    $('#bottomnav').innerHTML=items.filter(i=>main.includes(i[0])).map(btn).join('')+`<button data-a="more" class="${inMore?'on':''}">${I.more}<span>More</span></button>`; }
  else $('#bottomnav').innerHTML=items.map(btn).join('');
  $('#sidefoot').innerHTML = `<div style="text-transform:uppercase">${esc(S.me.name)}</div><div style="opacity:.7">${role()==='admin'?'Admin':'Salesperson'}</div><div class="row" style="gap:6px;margin-top:4px"><button class="rolepill" data-a="changePw">Change password</button><button class="rolepill" data-a="signOut">Sign out</button></div>`;
  $('#whoami').innerHTML=`<span class="who" style="text-transform:uppercase">${esc(S.me.name)}</span>`;
  $('#rolepill').hidden=false; $('#rolepill').textContent='Sign out';
}

/* ---------- auth screens ---------- */
function authScreen(html){ document.body.classList.add('authmode'); $('#authroot').innerHTML=`<div class="authwrap"><div class="authcard"><div class="brand"><b>Seaways Exim</b><span>Order desk</span></div>${html}</div></div>`; $('#approot').hidden=true; $('#bottomnav').hidden=true; }
function showApp(){ $('#authroot').innerHTML=''; $('#approot').hidden=false; $('#bottomnav').hidden=false; }

  if(S.bootstrapped===null){ authScreen('<p class="muted">Loading…</p>'); return; }
  if(!S.bootstrapped){
    authScreen(`<h2>Create the admin login</h2><p class="muted small" style="margin:6px 0 16px">First-time setup. This is your admin account. You'll add salespeople from the Team page afterwards.</p>
      <form class="stack" id="setupForm" onsubmit="return false"><label class="f">Your name<input class="input" name="name" required></label><label class="f">Username<span class="hint">Letters and numbers, no spaces</span><input class="input nocaps" name="username" autocapitalize="none" autocomplete="username" required></label>
      <label class="f">Password<span class="hint">At least 6 characters</span><input class="input" type="password" name="pw" autocomplete="new-password" required></label><label class="f">Repeat password<input class="input" type="password" name="pw2" autocomplete="new-password" required></label>
      <div class="err" id="autherr"></div><button class="btn block" data-a="setupAdmin">Create admin login</button></form>`); return;
  }
  authScreen(`<h2>Sign in</h2><p class="muted small" style="margin:6px 0 16px">Use the username and password your admin gave you.</p>
    <form class="stack" id="loginForm" onsubmit="return false"><label class="f">Username<input class="input nocaps" name="username" autocapitalize="none" autocomplete="username" required></label>
    <label class="f">Password<input class="input" type="password" name="pw" autocomplete="current-password" required></label><div class="err" id="autherr">${esc(S.authMsg||'')}</div>
    <button class="btn block" data-a="login">Sign in</button></form>`);
  setTimeout(()=>{ const n=$('#authroot input'); n&&n.focus(); },30);
}
function refreshSession(){
  if(!S.me){ renderAuth(); return; }
  showApp(); render();
}
/* ---------- render ---------- */
function render(){
  if(!S.ready || !S.me) return;
  renderNav();
  const a=document.activeElement, fid=a&&a.id&&$('#main').contains(a)?a.id:null;
  let ss=null,se=null; try{ ss=a.selectionStart; se=a.selectionEnd; }catch(e){}
  let html='';
  if(S.readOnly) html+=`<div class="notice" style="margin-bottom:14px">You have view-only access to this page. Ask the admin to share it with you as a Contributor so you can save.</div>`;
  const V={home:viewHome,dashboard:viewDashboard,order:viewOrder,orders:viewOrders,customers:viewCustomers,catalog:viewCatalog,bulk:viewBulk,journey:viewJourney,journeys:viewJourneys,team:viewTeam};
  html+=(V[S.view]||viewHome)();
  $('#main').innerHTML=html;
  if(fid){ const n=document.getElementById(fid); if(n){ n.focus({preventScroll:true}); try{ if(ss!=null) n.setSelectionRange(ss,se); }catch(e){} } }
  hydrateImages($('#main')); tick();
}
function tick(){ document.querySelectorAll('[data-since]').forEach(el=>el.textContent=dur((Date.now()-Number(el.dataset.since))/60000)); }
setInterval(tick,30000);

/* ---------- home (salesperson) ---------- */
function doors(){
  return `<div class="doors">${['restaurant','grocery'].map(ch=>{
    const pc=productsFor(ch).length, cc=S.customers.filter(c=>c.type===ch).length;
    return `<button class="door" data-a="startOrder" data-ch="${ch}"><span class="ic">${CH[ch].icon}</span><div><h2>${CH[ch].label}</h2><p class="muted small" style="margin-top:4px">Start a ${ch==='restaurant'?'restaurant':'grocery store'} order</p></div><div class="meta">${pc} products, ${cc} customers</div></button>`;
  }).join('')}</div>`;
}
function resumeCard(){
  if(!S.draft || !draftCount()) return '';
  const c=getCustomer(S.draft.customerId)||S.draft.customer;
  return `<div class="card pad row between wrap" style="margin-top:14px;border-color:var(--gold)"><div><h3>Order in progress</h3><p class="muted small" style="text-transform:uppercase">${esc(c?c.name:'No customer yet')}, ${draftCount()} items, ${money(draftTotal())}</p></div><div class="row"><button class="btn ghost sm" data-a="discardDraft">Discard</button><button class="btn sm" data-a="resume">Continue order</button></div></div>`;
}
function journeyBanner(){
  const j=myActiveJourney();
  if(j) return `<div class="card pad row between wrap" style="margin-bottom:16px;border-color:var(--ok)"><div><h3><span class="dot"></span>Journey running</h3><p class="muted small">Started ${fmtTime(j.startAt)} from <span style="text-transform:uppercase">${esc(j.startPlace)}</span>, <span data-since="${j.startAt}"></span> on the road</p></div><button class="btn sm" data-a="nav" data-v="journey">End journey</button></div>`;
  const today=S.journeys.some(x=>x.memberId===S.me.id && x.startAt>=startOfDay());
  return today?'':`<div class="card pad row between wrap" style="margin-bottom:16px"><div><h3>Heading out?</h3><p class="muted small">Log your odometer before you drive.</p></div><button class="btn sm" data-a="nav" data-v="journey">${I.route} Start journey</button></div>`;
}
function greet(){ const hr=new Date().getHours(); return `${hr<12?'Good morning':hr<17?'Good afternoon':'Good evening'}, <span style="text-transform:uppercase">${esc(S.me.name.split(' ')[0])}</span>`; }
function todayBlock(){ const today=S.orders.filter(o=>o.createdBy===S.me.id && o.createdAt>=startOfDay());
  return `<div class="row between" style="margin:26px 0 10px"><h2>Today</h2><span class="muted small">${today.length} orders, ${money(today.reduce((a,o)=>a+(o.total||0),0))}</span></div>${orderList(today.slice(0,8),'No orders yet today.')}`; }
function viewHome(){
  const mine=S.orders.filter(o=>o.createdBy===S.me.id);
  const today=mine.filter(o=>o.createdAt>=startOfDay());
  const hr=new Date().getHours(); const g=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  return `<div class="pagehead"><div><h1>${g}, <span style="text-transform:uppercase">${esc(S.me.name.split(' ')[0])}</span></h1><p class="muted">Where are you visiting? Pick the store type to open its catalog.</p></div></div>
  ${journeyBanner()}${doors()}${resumeCard()}
  <div class="row between" style="margin:26px 0 10px"><h2>Today</h2><span class="muted small">${today.length} orders, ${money(today.reduce((a,o)=>a+(o.total||0),0))}</span></div>
  ${orderList(today.slice(0,8),'No orders yet today. Start one above.')}`;
}

/* ---------- dashboard (admin) ---------- */
function viewDashboard(){
  const t0=startOfDay(), m0=startOfMonth();
  const live=S.orders.filter(o=>o.status!=='cancelled');
  const today=live.filter(o=>o.createdAt>=t0), month=live.filter(o=>o.createdAt>=m0);

  const js=jStats(S.journeys.filter(j=>j.startAt>=m0));
  const low=S.products.filter(p=>p.active!==false && hasStock(p) && Number(p.stock)<=(Number(p.lowAt)||10)).sort((a,b)=>a.stock-b.stock).slice(0,8);
  const recentJ=S.journeys.slice(0,5);
  return `<div class="pagehead"><div><h1>Dashboard</h1><p class="muted">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</p></div><button class="btn" data-a="nav" data-v="order">${I.plus} New order</button></div>
  <div class="stats">
    <div class="card stat"><div class="l">Orders today</div><div class="v">${today.length}</div><div class="small muted">${money(today.reduce((a,o)=>a+(o.total||0),0))}</div></div>
    <div class="card stat"><div class="l">Awaiting confirmation</div><div class="v">${fresh.length}</div></div>
    <div class="card stat"><div class="l">Revenue this month</div><div class="v">${money(month.reduce((a,o)=>a+(o.total||0),0))}</div></div>
    <div class="card stat"><div class="l">Miles this month</div><div class="v">${mi(js.miles)} mi</div><div class="small muted">${js.pending} trips to verify</div></div>
  </div>
  ${!S.products.length?`<div class="card pad row between wrap" style="margin-bottom:18px;border-color:var(--gold)"><div><h3>Set up your catalog first</h3><p class="muted small">Import a CSV or add products one by one. Salespeople see them right away.</p></div><button class="btn" data-a="nav" data-v="catalog">Open catalog</button></div>`:''}
  <div style="display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <div><div class="row between" style="margin-bottom:10px"><h2>New orders</h2><button class="linkbtn" data-a="nav" data-v="orders">All orders</button></div>${orderList(fresh.slice(0,6),'No new orders waiting.')}</div>
    <div><div class="row between" style="margin-bottom:10px"><h2>Low stock</h2><button class="linkbtn" data-a="nav" data-v="bulk">Bulk edit</button></div>
    ${low.length?`<div class="card list">${low.map(p=>`<button class="li" data-a="editProduct" data-id="${esc(p.id)}"><span class="grow"><div class="t">${esc(p.name)}</div></span><span style="font-weight:700;color:${Number(p.stock)<=0?'var(--bad)':'var(--warn)'}">${Number(p.stock)} left</span></button>`).join('')}</div>`:`<div class="card empty">Nothing low right now.</div>`}</div>
    <div><div class="row between" style="margin-bottom:10px"><h2>Recent journeys</h2><button class="linkbtn" data-a="nav" data-v="journeys">All journeys</button></div>
    ${recentJ.length?`<div class="card list">${recentJ.map(j=>`<button class="li" data-a="openJourney" data-id="${esc(j.id)}"><span class="avatar">${I.route.replace('<svg','<svg style="width:18px;height:18px"')}</span><span class="grow"><div class="t">${esc(nameOf(j.memberId))}</div><div class="s">${fmtDate(j.startAt)}</div></span><span style="text-align:right"><div style="font-weight:700">${j.status==='active'?'<span class="pill s-active">Active</span>':mi(j.distance)+' mi'}</div><div class="small muted">${j.status==='active'?'':dur(j.durationMin)}</div></span></button>`).join('')}</div>`:`<div class="card empty">No journeys logged yet.</div>`}</div>
  </div>`;
}

/* ---------- order list ---------- */
function orderList(list, emptyMsg){
  if(!list.length) return `<div class="card empty">${esc(emptyMsg)}</div>`;
  return `<div class="card list">${list.map(o=>`<button class="li" data-a="openOrder" data-id="${esc(o.id)}"><span class="avatar">${esc(initials(o.customer&&o.customer.name))}</span><span class="grow"><div class="t">${esc(o.customer&&o.customer.name)}</div><div class="s">${esc(o.number)}, ${fmtDT(o.createdAt)}${role()==='admin'?', '+esc(nameOf(o.createdBy)):''}</div></span><span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="amt">${money(o.total)}</span>${o.priceAdjusted&&role()==='admin'?'<span class="pill st-low">Price changed</span>':''}<span class="pill s-${esc(o.status)}">${esc(statusLabel(o.status))}</span></span></button>`).join('')}</div>`;
}

/* ---------- order flow ---------- */
function stepsBar(n){ return `<div class="steps">${[1,2,3].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('')}</div>`; }
function viewOrder(){
  const d=S.draft, st=S.step;
  if(st==='done') return viewDone();
  if(st==='channel' || !d.channel) return `<div class="pagehead"><div><h1>${role()==='admin'?'New order':greet()}</h1><p class="muted">Choose the type of store you are visiting.</p></div></div>${role()==='sales'?journeyBanner():''}${doors()}${resumeCard()}${role()==='sales'?todayBlock():''}`;
  if(st==='customer' || !d.customerId) return viewPickCustomer();
  if(st==='review') return viewReview();
  return viewShop();
}
function viewPickCustomer(){
  const d=S.draft, q=S.q.cust.trim().toLowerCase();
  let list=visibleCustomers().filter(c=>S.custAll || c.type===d.channel);
  if(q) list=list.filter(c=>[c.name,c.contact,c.phone,c.city,c.address].join(' ').toLowerCase().includes(q));
  list.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  return `${stepsBar(1)}<div class="pagehead"><div><p class="muted small">${CH[d.channel].label} order, step 1 of 3</p><h1>Choose customer</h1></div><div class="row wrap"><button class="btn ghost" data-a="changeChannel">Change store type</button><button class="btn" data-a="newCustomer" data-ch="${d.channel}">${I.plus} New customer</button></div></div>
  <div class="stack">
    <div class="search">${I.search}<input class="input" id="custSearch" data-in="q" data-k="cust" placeholder="Search by name, phone or city" value="${esc(S.q.cust)}" autocomplete="off"></div>
    <label class="row small muted" style="gap:8px;cursor:pointer"><input type="checkbox" class="cb" data-in="custAll" ${S.custAll?'checked':''}> Show ${d.channel==='restaurant'?'grocery stores':'restaurants'} too</label>
    ${list.length?`<div class="card list">${list.slice(0,200).map(c=>`<button class="li" data-a="pickCustomer" data-id="${esc(c.id)}"><span class="avatar">${esc(initials(c.name))}</span><span class="grow"><div class="t">${esc(c.name)}</div><div class="s">${esc([c.contact,c.phone,c.city].filter(Boolean).join(', '))||(CH[c.type]?CH[c.type].label:'')}</div></span><span class="muted small">Select</span></button>`).join('')}</div>`
    :`<div class="card empty"><h3>${q?'No match for “'+esc(up(S.q.cust))+'”':'No '+(d.channel==='restaurant'?'restaurants':'grocery stores')+' yet'}</h3><p style="margin-bottom:14px">Add them now. You'll go straight to the catalog after saving.</p><button class="btn" data-a="newCustomer" data-ch="${d.channel}" data-name="${esc(S.q.cust)}">${I.plus} Add new customer</button></div>`}
  </div>`;
}
function custBar(){
  const d=S.draft, c=getCustomer(d.customerId)||d.customer||{};
  return `<div class="card custbar"><span class="avatar">${esc(initials(c.name))}</span><div class="grow"><div style="font-weight:600">${esc(c.name||'Customer')}</div><div class="muted small">${CH[d.channel].label}${c.city?', '+esc(c.city):''}</div></div><button class="btn ghost sm" data-a="changeCustomer">Change</button></div>`;
}
function viewShop(){
  const d=S.draft; const all=productsFor(d.channel);
  const cats=[...new Set(all.map(p=>p.category).filter(Boolean))].sort();
  const q=S.q.prod.trim().toLowerCase();
  let list=all;
  if(S.cat) list=list.filter(p=>p.category===S.cat);
  if(q) list=list.filter(p=>[p.name,p.sku,p.category,p.pack].join(' ').toLowerCase().includes(q));
  list=[...list].sort((a,b)=>String(a.category||'').localeCompare(String(b.category||''))||String(a.name).localeCompare(String(b.name)));
  const n=draftCount();
  return `${stepsBar(2)}${custBar()}
  <div class="stack" style="gap:10px">
    <div class="search">${I.search}<input class="input" id="prodSearch" data-in="q" data-k="prod" placeholder="Search ${CH[d.channel].label.toLowerCase()} catalog" value="${esc(S.q.prod)}" autocomplete="off"></div>
    ${cats.length>1?`<div class="chips"><button class="chip ${!S.cat?'on':''}" data-a="cat" data-c="">ALL</button>${cats.map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="cat" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
  </div>
  <div style="margin-top:12px">
  ${!all.length?`<div class="card empty"><h3>No ${CH[d.channel].label.toLowerCase()} products yet</h3><p>${role()==='admin'?'Add products in Catalog and tick “'+CH[d.channel].label+'”.':'Ask the admin to add products to this catalog.'}</p></div>`
   :!list.length?`<div class="card empty">No products match.</div>`
   :`<div class="pgrid">${list.slice(0,240).map(productCard).join('')}</div>${list.length>240?`<p class="muted small" style="margin-top:10px">Showing 240 of ${list.length}. Search to narrow down.</p>`:''}`}
  </div>
  ${n?`<div class="cartbar"><span>${I.cart}</span><div class="grow"><div class="small" style="opacity:.8">${n} items</div><b>${money(draftTotal())}</b></div><button class="btn" data-a="review">Review order</button></div>`:''}`;
}
function productCard(p){
  const q=S.draft.lines[p.id]||0; const moq=Number(p.moq)||1; const cid=S.draft.customerId; const sp=hasSpecial(p,cid);
  return `<div class="pcard ${q?'in':''}"><div class="pimg">${imgTag(p)||`<span class="ph">${esc(initials(p.name))}</span>`}</div>
  <div class="pbody"><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc([packOf(p),cwOf(p)?'= '+cwOf(p):'',p.sku].filter(Boolean).join(', '))}${moq>1?`, MOQ ${moq}`:''}</div>${stockPill(p)}<div class="pprice">${money(priceFor(p,cid))}${sp?` <span class="pill s-confirmed" title="Special price for this customer">Special</span> <s class="muted small" style="font-weight:400">${money(p.price)}</s>`:''}</div>
  ${q?`<div class="stepper"><button data-a="qty" data-id="${esc(p.id)}" data-d="-1" aria-label="Less">−</button><input id="q_${esc(p.id)}" type="number" inputmode="numeric" min="0" data-in="qty" data-id="${esc(p.id)}" value="${q}" aria-label="Quantity"><button data-a="qty" data-id="${esc(p.id)}" data-d="1" aria-label="More">+</button></div>`
     :`<button class="addbtn" data-a="qty" data-id="${esc(p.id)}" data-d="1">Add${moq>1?' '+moq:''}</button>`}
  </div></div>`;
}
function viewReview(){
  const d=S.draft, lines=draftLines();
  const under=lines.filter(({p,qty})=>qty<(Number(p.moq)||1));
  return `${stepsBar(3)}<div class="pagehead"><div><p class="muted small">Step 3 of 3</p><h1>Review order</h1></div><button class="btn ghost" data-a="backToShop">Add more items</button></div>
  ${custBar()}
  ${!lines.length?`<div class="card empty"><h3>No items yet</h3><button class="btn" data-a="backToShop">Open catalog</button></div>`:`
  ${under.length?`<div class="notice" style="margin-bottom:12px">Below minimum order qty: ${under.map(({p})=>esc(p.name)+' (MOQ '+p.moq+')').join(', ')}</div>`:''}
  <div class="card lines">${lines.map(({p,qty})=>`<div class="ln"><div><div style="font-weight:600;text-transform:uppercase">${esc(p.name)}</div><div class="muted small">${esc([packOf(p),p.sku].filter(Boolean).join(', '))}</div>
  <div class="row wrap" style="gap:8px;margin-top:8px"><label class="row small" style="gap:6px">Price per case $<input class="cell w ${isAdjusted(p)?'chg':''}" style="${belowMin(p)?'border-color:var(--bad);background:var(--bad-soft)':''}" id="rp_${esc(p.id)}" inputmode="decimal" data-in="lprice" data-id="${esc(p.id)}" value="${linePrice(p).toFixed(2)}"></label>
  ${isAdjusted(p)?`<span class="small muted">List ${money(priceFor(p,d.customerId))}, ${linePrice(p)<priceFor(p,d.customerId)?'−':'+'}${trimN(Math.abs(1-linePrice(p)/(priceFor(p,d.customerId)||1))*100)}% <button class="linkbtn small" data-a="resetPrice" data-id="${esc(p.id)}">Reset</button></span>`:''}
  ${belowMin(p)?`<span class="small" style="color:var(--bad);font-weight:600">Lowest allowed is ${money(minOf(p))}</span>`:''}</div></div><div style="font-weight:700;text-align:right">${money(qty*linePrice(p))}</div>
  <div class="stepper"><button data-a="qty" data-id="${esc(p.id)}" data-d="-1">−</button><input id="r_${esc(p.id)}" type="number" inputmode="numeric" min="0" data-in="qty" data-id="${esc(p.id)}" value="${qty}"><button data-a="qty" data-id="${esc(p.id)}" data-d="1">+</button></div><div style="text-align:right"><button class="linkbtn" style="color:var(--bad)" data-a="removeLine" data-id="${esc(p.id)}">Remove</button></div></div>`).join('')}
  <div class="totals"><span>Total, ${draftCount()} items${(()=>{ const list=lines.reduce((a,{p,qty})=>a+qty*priceFor(p,d.customerId),0); const t=draftTotal(); return Math.abs(list-t)>0.004?`<div class="small muted">List total ${money(list)}, ${t<list?'discount':'increase'} ${money(Math.abs(list-t))}</div>`:''; })()}</span><b>${money(draftTotal())}</b></div></div>
  <p class="small muted" style="margin-top:8px">Tap a price to change it for this customer. The office sees any change you make.</p>
  <div class="card pad stack" style="margin-top:14px">
    <label class="f">Delivery date <span class="hint">Optional</span><input class="input" type="date" id="dDate" data-in="draftField" data-k="deliveryDate" value="${esc(d.deliveryDate)}"></label>
    <label class="f">Notes for the office <span class="hint">Optional</span><textarea class="input" id="dNotes" data-in="draftField" data-k="notes" placeholder="Payment terms, delivery instructions">${esc(d.notes)}</textarea></label>
  </div>
  <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn block" style="max-width:360px;min-height:50px;font-size:16px" data-a="placeOrder" ${S.placing||S.readOnly?'disabled':''}>${S.placing?'Placing order…':'Place order, '+money(draftTotal())}</button></div>`}`;
}
function viewDone(){
  const o=S.lastOrder||{};
  return `<div class="card done"><div class="check">${I.check}</div><h1>Order placed</h1><p class="muted" style="margin:8px 0 4px;text-transform:uppercase">${esc(o.number)} for ${esc(o.customer&&o.customer.name)}</p><p style="font-weight:700;font-size:20px;margin-bottom:22px">${money(o.total)}</p>
  <div class="row wrap" style="justify-content:center"><button class="btn ghost" data-a="nav" data-v="${role()==='admin'?'dashboard':'order'}">Back to home</button><button class="btn ghost" data-a="openOrder" data-id="${esc(o.id)}">View order</button><button class="btn" data-a="startOrder" data-ch="${esc(o.channel)}">Next ${o.channel==='restaurant'?'restaurant':'grocery'} order</button></div></div>`;
}

/* ---------- orders ---------- */
function filteredOrders(){
  let list = role()==='admin' ? S.orders : S.orders.filter(o=>o.createdBy===S.me.id);
  if(S.orderFilter!=='all') list=list.filter(o=>o.status===S.orderFilter);
  const q=S.q.orders.trim().toLowerCase();
  if(q) list=list.filter(o=>[o.number,o.customer&&o.customer.name,nameOf(o.createdBy)].join(' ').toLowerCase().includes(q));
  return list;
}
function viewOrders(){
  const list=filteredOrders();
  return `<div class="pagehead"><div><h1>${role()==='admin'?'Orders':'My orders'}</h1><p class="muted">${list.length} shown, ${money(list.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+(o.total||0),0))}</p></div>
  <div class="row">${role()==='admin'&&S.downloads?`<button class="btn ghost" data-a="exportOrders">Download CSV</button>`:''}<button class="btn" data-a="nav" data-v="order">${I.plus} New order</button></div></div>
  <div class="stack" style="gap:10px;margin-bottom:12px">
    <div class="search">${I.search}<input class="input" id="orderSearch" data-in="q" data-k="orders" placeholder="Search order number, customer${role()==='admin'?' or salesperson':''}" value="${esc(S.q.orders)}"></div>
    <div class="chips">${[['all','All'],...STATUS].map(([k,l])=>`<button class="chip ${S.orderFilter===k?'on':''}" data-a="orderFilter" data-k="${k}">${l}</button>`).join('')}</div>
  </div>${orderList(list.slice(0,300),'No orders here yet.')}`;
}
function openOrder(id){
  const o=S.orders.find(x=>x.id===id) || (S.lastOrder&&S.lastOrder.id===id?S.lastOrder:null); if(!o) return;
  const c=o.customer||{};
  modal(`<div class="sh"><div><h2>${esc(o.number)}</h2><p class="muted small">${fmtDT(o.createdAt)}, by <span style="text-transform:uppercase">${esc(nameOf(o.createdBy))}</span></p></div><button class="x" data-a="close">×</button></div>
  <div class="row between" style="margin-bottom:14px"><span class="pill s-${esc(o.status)}">${esc(statusLabel(o.status))}</span><span class="muted small">${CH[o.channel]?CH[o.channel].label:''}</span></div>
  <dl class="kv"><dt>Customer</dt><dd><b>${esc(c.name)}</b></dd>${c.contact?`<dt>Contact</dt><dd>${esc(c.contact)}</dd>`:''}${c.phone?`<dt>Phone</dt><dd>${esc(c.phone)}</dd>`:''}${c.address||c.city?`<dt>Address</dt><dd>${esc([c.address,c.city].filter(Boolean).join(', '))}</dd>`:''}${o.deliveryDate?`<dt>Delivery</dt><dd>${esc(fmtDate(o.deliveryDate+'T12:00'))}</dd>`:''}${o.notes?`<dt>Notes</dt><dd>${esc(o.notes)}</dd>`:''}</dl>

function sheetData(o){
  const cu={...(o.customer||{}),...(()=>{ const c=getCustomer(o.customerId); return c?{taxId:c.taxId,email:c.email}:{}; })()};
  const lines=(o.lines||[]).map(l=>{ let cw=l.caseWt, lb=l.caseLb; if(cw==null){ const p=S.products.find(x=>x.id===l.pid); const w=p&&caseWt(struct(p)); cw=w?w.text:''; lb=w?toLb(w):0; } return {...l,caseWt:cw,caseLb:lb||0}; });
  const cases=lines.reduce((a,l)=>a+l.qty,0), weight=lines.reduce((a,l)=>a+l.qty*(l.caseLb||0),0);
  return {o,cu,lines,cases,weight,co:company()};
}

const BF = {price:'Price',moq:'MOQ',stock:'Stock',lowAt:'Low stock'};
const SF=['unitQty','unit','pcs'];
function baseVal(p,f){ if(f==='category') return p.category||''; if(SF.includes(f)) return struct(p)[f]; if(f==='customerPrices') return p.customerPrices||{}; return p[f]===undefined?null:p[f]; }
function bval(p,f){ const e=S.bulk.edits[p.id]; return e && f in e ? e[f] : baseVal(p,f); }
function eqv(f,a,b){ if(f==='customerPrices'){ const ks=new Set([...Object.keys(a||{}),...Object.keys(b||{})]); for(const k of ks){ const x=(a||{})[k], y=(b||{})[k]; const nx=x==null||x===''?null:Number(x), ny=y==null||y===''?null:Number(y); if(nx!==ny) return false; } return true; } return JSON.stringify(a)===JSON.stringify(b); }
function bchanged(p){ const e=S.bulk.edits[p.id]; if(!e) return false; return Object.keys(e).some(f=>!eqv(f,e[f],baseVal(p,f))); }
function bulkList(){
  const q=S.q.bulk.trim().toLowerCase();
  let list=S.products;
  if(S.bulk.cat) list=list.filter(p=>catOf(p)===S.bulk.cat);
  if(q) list=list.filter(p=>[bval(p,'name'),p.sku].join(' ').toLowerCase().includes(q));
  if(S.bulk.only) list=list.filter(bchanged);
  return [...list].sort((a,b)=>String(a.name).localeCompare(String(b.name)));
}
function bulkChangedCount(){ return S.products.filter(bchanged).length; }

function apOps(f){
  if(f==='price'||f==='cprice'||f==='minPrice') return '<option value="pct+">Raise by %</option><option value="pct-">Lower by %</option><option value="add">Add amount</option><option value="sub">Subtract amount</option><option value="set">Set to</option>'+(f==='cprice'?'<option value="clear">Clear (use list price)</option>':'');
  if(f==='category') return '<option value="set">Move to category</option><option value="clear">Remove category</option>';
  if(f==='active') return '<option value="yes">Make available</option><option value="no">Make unavailable</option>';
  if(f==='restaurant'||f==='grocery') return '<option value="yes">Add to catalog</option><option value="no">Remove from catalog</option>';
  return '<option value="set">Set to</option><option value="add">Add</option><option value="sub">Subtract</option>';
}
function calc(base,op,v){ if(op==='pct+') return base*(1+v/100); if(op==='pct-') return base*(1-v/100); if(op==='add') return base+v; if(op==='sub') return base-v; return v; }

function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  text=String(text).replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','||c==='\t'){ row.push(f); f=''; } else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; } else if(c!=='\r') f+=c; }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const csvCell = v => { const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
const toCSV = rows => rows.map(r=>r.map(csvCell).join(',')).join('\n');
const TEMPLATE = 'sku,name,category,unit_size,unit,pcs_per_case,price,moq,stock_qty,low_stock,channel,active\nPAR-BAS-10,PARADISE BASMATI RICE 10 LB,RICE,10,LB,4,72.00,1,120,10,both,yes\nAMB-MAK-100,AMBER MAKHANA 100 G,SNACKS,100,G,24,54.00,2,40,10,grocery,yes\n';
function mapRow(h,r){
  const get=(...keys)=>{ for(const k of keys){ const i=h.indexOf(k); if(i>-1 && r[i]!=null && String(r[i]).trim()!=='') return String(r[i]).trim(); } return ''; };
  const sku=get('sku','item_code','code','item'), name=get('name','product','product_name','item_name');
  if(!name) return null;
  const chRaw=get('channel','catalogs','catalog','segment','type').toLowerCase();
  const channels = !chRaw||/both|all/.test(chRaw)?['restaurant','grocery']:[...(/rest|food/.test(chRaw)?['restaurant']:[]),...(/groc|retail|store/.test(chRaw)?['grocery']:[])];
  const stockS=get('stock_qty','stock','qty','quantity'); const act=get('active','available','visible').toLowerCase(); const moqS=get('moq','min_qty'); const lowS=get('low_stock','low_at','reorder');
  const o={sku:up(sku),name:up(name),category:up(get('category')),pack:up(get('pack_size','pack','case','size','unit')),price:num(get('price','rate','unit_price')),
    stock:stockS===''?null:num(stockS),channels:channels.length?channels:['restaurant','grocery'],active:!/^(no|n|false|0)$/.test(act)};
  const minS=get('min_price','min_sell','minimum_price'); if(minS!=='') o.minPrice=num(minS);
  if(moqS!=='') o.moq=Math.max(1,Math.round(num(moqS))); if(lowS!=='') o.lowAt=num(lowS);
  const us=get('unit_size','unit_qty','size_each'), pcsS=get('pcs_per_case','pcs','pieces','case_qty');
  let st = us!==''||pcsS!=='' ? {unitQty:us===''?null:num(us),unit:normU(get('unit','uom')||'LB'),pcs:pcsS===''?null:num(pcsS)} : parsePack(o.pack);
  if(st){ o.unitQty=st.unitQty; o.unit=st.unit; o.pcs=st.pcs; o.pack=packText(st,o.pack); }
  return o;
}

  const t=$('#ptxt'); if(t) t.textContent=`Saving ${list.length} products…`;

async function compress(file){
  try{ const bmp=await createImageBitmap(file); const m=900, s=Math.min(1,m/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82)); return b||file; }catch(e){ return file; }
}
async function uploadImage(file){
  const bmp=await createImageBitmap(file); let data=null;
  for(const [m,q] of [[900,.8],[700,.72],[520,.65],[400,.6]]){ const k=Math.min(1,m/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height); data=c.toDataURL('image/jpeg',q); if(data.length<700000) break; }
  const ref=S.db.collection('productImages').doc(); await ref.set({data,at:Date.now()}); IMGC[ref.id]=data; return ref.id;
}

async function runBulkPhotos(files){
  const log=$('#photolog'); const bySku={}; S.products.forEach(p=>{ if(p.sku) bySku[String(p.sku).toLowerCase()]=p; bySku[String(p.name).toLowerCase()]=p; });
  const matched=[], missed=[];
  [...files].forEach(f=>{ const base=f.name.replace(/\.[^.]+$/,'').trim().toLowerCase(); const p=bySku[base]; p?matched.push([f,p]):missed.push(f.name); });
  log.innerHTML=`<div class="progress"><i id="pbar2"></i></div><p id="ptxt2" style="margin-top:6px">${matched.length} matched${missed.length?`, ${missed.length} with no matching SKU`:''}</p>${missed.length?`<p class="muted" style="margin-top:6px">Not matched: ${esc(missed.slice(0,12).join(', '))}${missed.length>12?'…':''}</p>`:''}`;
  let n=0, fail=0;
  for(const [f,p] of matched){ try{ const id=await uploadImage(f); await withRetry(()=>S.db.collection('catalog').doc(p.id).update({imageId:id,updatedAt:Date.now()})); }catch(e){ fail++; }
    n++; const b=$('#pbar2'); if(b) b.style.width=(n/matched.length*100)+'%'; const t=$('#ptxt2'); if(t) t.textContent=`Uploaded ${n-fail} of ${matched.length}${fail?`, ${fail} failed`:''}`; }
  if(matched.length) toast(`Photos updated: ${n-fail}`);
}

  bulkApply:()=>{
    const f=$('#apField').value, op=$('#apOp').value, raw=$('#apVal').value, v=num(raw); const cid=S.bulk.cust;
    const needsVal=!['active','restaurant','grocery'].includes(f)&&op!=='clear'; if(needsVal && raw.trim()===''){ toast(f==='category'?'Type the category name':'Enter a value'); return; }
    const ids=Object.keys(S.bulk.sel).filter(k=>S.bulk.sel[k]); let n=0;
    ids.forEach(id=>{ const p=S.products.find(x=>x.id===id); if(!p) return; n++;
      if(f==='category'){ bset(p,'category',op==='clear'?'':up(raw)); return; }
      if(f==='active'){ bset(p,'active',op==='yes'); return; }
      if(f==='restaurant'||f==='grocery'){ const cur=bval(p,'channels')||[]; const nx=op==='yes'?[...new Set([...cur,f])]:cur.filter(c=>c!==f); bset(p,'channels',['restaurant','grocery'].filter(c=>nx.includes(c))); return; }
      if(f==='cprice'){ const cps={...(bval(p,'customerPrices')||{})}; if(op==='clear'){ cps[cid]=null; bset(p,'customerPrices',cps); return; }
        const cur=cps[cid]; const base=cur==null||cur===''?Number(bval(p,'price'))||0:Number(cur); cps[cid]=Math.max(0,Math.round(calc(base,op,v)*100)/100); bset(p,'customerPrices',cps); return; }
      const base=Number(bval(p,f))||0; let r=Math.max(0,calc(base,op,v));
      r = f==='moq'? Math.max(1,Math.round(r)) : Math.round(r*100)/100; bset(p,f,r); });
    toast(`Applied to ${n} products. Press Save changes to keep them.`); render();
